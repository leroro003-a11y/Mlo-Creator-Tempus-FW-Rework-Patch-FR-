<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel" hidden>
  <div class="title">MLO Creator <span>live</span></div>
  <div id="name" class="sub"></div>
  <div id="sel" class="box"></div>
  <div id="steps" class="sub"></div>
  <div id="help" class="box keys"></div>
</div>
<div id="ask" hidden>
  <div class="title">Add a prop of the game</div>
  <input id="model" type="text" placeholder="prop_chair_01a, v_ilev_ph_door01..." autocomplete="off" spellcheck="false">
  <div class="sub">Enter: put it where the crosshair points · Esc: cancel</div>
</div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
